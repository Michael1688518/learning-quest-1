<style>

button{font:inherit}.wrap{max-width:1050px;margin:auto;padding:24px 18px 70px}header{display:flex;justify-content:space-between;gap:16px;align-items:center;margin:8px 0 22px}
.brand h1{margin:0;font-size:clamp(28px,5vw,44px)}.brand p{margin:7px 0;color:var(--muted)}.stats{display:flex;gap:8px;flex-wrap:wrap}.badge{background:#fff;padding:10px 14px;border-radius:16px;box-shadow:var(--shadow);white-space:nowrap}
.hero{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-radius:28px;padding:25px;box-shadow:var(--shadow)}.hero h2{margin:0 0 7px}.progress{height:13px;background:#ffffff3a;border-radius:99px;overflow:hidden;margin-top:16px}.progress i{display:block;height:100%;background:#fff;border-radius:99px;transition:.3s}
.section-title{margin:28px 2px 13px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{border:0;text-align:left;background:var(--card);border-radius:22px;padding:19px;box-shadow:var(--shadow);cursor:pointer;min-height:142px;color:inherit;transition:.15s}.card:hover{transform:translateY(-2px)}.card:active{transform:scale(.985)}.icon{font-size:34px}.card h3{margin:9px 0 4px}.card p{margin:0;color:var(--muted);font-size:14px;line-height:1.45}
.panel{display:none;margin-top:20px;background:#fff;border-radius:25px;padding:22px;box-shadow:var(--shadow)}.panel.show{display:block}.panelTop{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.panel h2{margin:0 0 5px}
.levels,.units{display:flex;flex-wrap:wrap;gap:8px;margin:15px 0}.pill{border:1px solid var(--line);background:#fafbff;border-radius:14px;padding:9px 13px;cursor:pointer}.pill.active{background:#172033;color:#fff;border-color:#172033}.units .pill.active{background:var(--accent);border-color:var(--accent)}
.questMeta{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-top:18px}.miniProgress{height:9px;background:#e8ebf3;border-radius:99px;overflow:hidden;flex:1}.miniProgress i{display:block;height:100%;background:var(--accent);transition:.3s}
.challenge{margin-top:12px;padding:20px;border-radius:20px;background:#f7f8fc}.qnum{color:var(--muted);font-size:14px}.question{font-size:19px;line-height:1.6;margin:10px 0 15px;font-weight:650}.choices{display:grid;gap:9px}.choice{padding:13px 14px;border:1px solid var(--line);border-radius:14px;background:#fff;text-align:left;cursor:pointer;font-size:16px}.choice:hover{border-color:#aeb7d0}.choice.good{border-color:var(--ok);background:#eafaf3}.choice.bad{border-color:#f0aaa5;background:#fff0ef}.choice:disabled{cursor:default;color:inherit}.feedback{min-height:28px;margin:13px 0 0;font-weight:650}.feedback.ok{color:var(--ok)}.feedback.no{color:var(--bad)}
.actions{display:flex;gap:9px;margin-top:10px}.next,.reset{border:0;border-radius:14px;padding:11px 16px;cursor:pointer}.next{background:var(--accent);color:#fff;display:none}.reset{background:#eceff6;color:var(--ink)}
.finish{text-align:center;padding:24px}.finish .big{font-size:48px}.finish h3{font-size:25px;margin:8px}.footer{text-align:center;color:var(--muted);margin-top:32px;font-size:13px}
@media(max-width:720px){.grid{grid-template-columns:repeat(2,1fr)}header{align-items:flex-start;flex-direction:column}.panelTop{flex-direction:column}}@media(max-width:440px){.grid{grid-template-columns:1fr}.card{min-height:120px}.wrap{padding:16px 12px 55px}.challenge,.panel{padding:16px}.question{font-size:18px}}

<body><main class="wrap">
<header><div class="brand"><h1>🚀 Learning Quest</h1><p>小学全科学习大冒险 · 学一点，闯一关</p></div><div class="stats"><div class="badge">⭐ <b id="stars">0</b> 星</div><div class="badge">🔥 <b id="clears">0</b> 次通关</div></div></header>
<section class="hero"><h2>今天继续升级吧！</h2><div id="heroText">选择一个科目和等级，开始 10 题闯关。</div><div class="progress"><i id="bar"></i></div></section>
<h2 class="section-title">选择科目</h2><section class="grid" id="subjects"></section>
<section class="panel" id="panel">
<div class="panelTop"><div><h2 id="subjectTitle"></h2><div id="subjectDesc"></div></div><button class="reset" id="restart">重新开始本关</button></div>
<div class="levels" id="levels"></div><div class="units" id="units"></div>
<div class="questMeta"><span id="scoreText">得分 0</span><div class="miniProgress"><i id="qbar"></i></div><span id="countText">1 / 10</span></div>
<div class="challenge" id="challenge"><div class="qnum" id="qnum"></div><div class="question" id="question"></div><div class="choices" id="choices"></div><div class="feedback" id="feedback"></div><div class="actions"><button class="next" id="next">下一题 →</button></div></div>
</section><div class="footer">Learning Quest v1.0 · 进度自动保存在本设备</div>
</main>
<script>
const SUBJECTS={
"语文":{icon:"📚",desc:"G1–G6 · 识字、词语、阅读与表达",levels:["G1","G2","G3","G4","G5","G6"],units:["综合","识字词语","阅读理解"]},
"数学":{icon:"🧮",desc:"G1–G6 · 基础数学、奥数、等量代换、单位换算",levels:["G1","G2","G3","G4","G5","G6"],units:["综合","基础数学","奥数","单位换算"]},
"英语":{icon:"🌎",desc:"G1–G6 · Vocabulary、Grammar、Reading",levels:["G1","G2","G3","G4","G5","G6"],units:["综合","Vocabulary","Grammar"]},
"德语":{icon:"🇩🇪",desc:"A1–A2 · Wortschatz、Lesen、Grammatik",levels:["A1.1","A1.2","A2.1","A2.2"],units:["综合","Wortschatz","Grammatik"]},
"科学":{icon:"🔬",desc:"G1–G6 · 生命、物质、地球与宇宙",levels:["G1","G2","G3","G4","G5","G6"],units:["综合","生命科学","地球与物质"]},
"综合挑战":{icon:"🏆",desc:"跨学科任务 · 训练推理和解决问题能力",levels:["G1","G2","G3","G4","G5","G6"],units:["综合挑战"]}
};
const Q=(q,o,a,tip="",unit="综合")=>({q,o,a,tip,unit});
const fixed={
"语文":{
G1:[Q("“大”的反义词是？",["小","多","上"],"小","想一想大小。","识字词语"),Q("哪个字表示一种动物？",["猫","桌","云"],"猫","","识字词语"),Q("“日”通常表示什么？",["太阳","小河","树木"],"太阳","","识字词语"),Q("“我爱妈妈。”这句话里谁爱妈妈？",["我","妈妈","没有人"],"我","","阅读理解")],
G2:[Q("“高兴”的近义词更接近哪一个？",["开心","生气","害怕"],"开心","","识字词语"),Q("“小鸟在树上唱歌。”小鸟在哪里？",["树上","水里","屋里"],"树上","","阅读理解"),Q("“一边……一边……”通常表示什么？",["两个动作同时进行","只做一个动作","表示过去"],"两个动作同时进行","","阅读理解")],
G3:[Q("“春风又绿江南岸”中，哪个字生动表现春天的变化？",["绿","岸","风"],"绿","","阅读理解"),Q("“迫不及待”最接近哪个意思？",["急切得等不及","慢慢等待","完全不想做"],"急切得等不及","","识字词语"),Q("“因为下雨，所以比赛取消。”原因是什么？",["下雨","比赛","取消"],"下雨","","阅读理解")],
G4:[Q("“他像离弦的箭一样冲出去”使用了什么修辞？",["比喻","拟人","反问"],"比喻","","阅读理解"),Q("“坚持不懈”最合适形容哪种行为？",["遇到困难仍持续努力","做一次就放弃","什么也不做"],"遇到困难仍持续努力","","识字词语")],
G5:[Q("阅读时概括一段话的主要内容，首先应关注什么？",["中心句和关键信息","每个标点","字的笔画数"],"中心句和关键信息","","阅读理解"),Q("“即使……也……”表示哪种关系？",["假设让步","因果","并列"],"假设让步","","识字词语")],
G6:[Q("议论文中用于支持观点的事实、数据或事例称为什么？",["论据","标题","段落"],"论据","","阅读理解"),Q("“不但……而且……”通常表示什么关系？",["递进","转折","条件"],"递进","","识字词语")]
},
"英语":{
G1:[Q("Choose the animal.",["cat","book","red"],"cat","","Vocabulary"),Q('Complete: "I ___ happy."',['am','is','are'],"am","","Grammar"),Q("Which word is a color?",["blue","dog","run"],"blue","","Vocabulary")],
G2:[Q('Choose: "She ___ a book every day."',['reads','read','reading'],"reads","","Grammar"),Q("Which word means 很大的?",["big","small","slow"],"big","","Vocabulary")],
G3:[Q('Choose: "The birds ___ in the sky."',['fly','flies','flying'],"fly","","Grammar"),Q("Which word is closest to “quick”?",["fast","quiet","late"],"fast","","Vocabulary")],
G4:[Q('Choose the past tense of "go".',["went","goed","gone"],"went","","Grammar"),Q("Which word means “保护”?",["protect","collect","forget"],"protect","","Vocabulary")],
G5:[Q('Choose: "If it rains, we ___ inside."',['will stay','stayed','stays'],"will stay","","Grammar"),Q("Which word is closest to “important”?",["significant","tiny","silent"],"significant","","Vocabulary")],
G6:[Q('Choose the correct sentence.',['She has lived here for three years.','She live here for three years.','She living here three years.'],"She has lived here for three years.","","Grammar"),Q("Which word means “consequence” most closely?",["result","question","method"],"result","","Vocabulary")]
},
"德语":{
"A1.1":[Q('Wie heißt du?',['Ich heiße Kevin.','Ich bin acht Uhr.','Guten Appetit.'],"Ich heiße Kevin.","","Wortschatz"),Q('Was bedeutet "Haus"?',['房子','汽车','学校'],"房子","","Wortschatz"),Q('Ich ___ acht Jahre alt.',['bin','bist','ist'],"bin","","Grammatik")],
"A1.2":[Q('Er ___ Fußball.',['spielt','spiele','spielen'],"spielt","","Grammatik"),Q('Was bedeutet "Frühstück"?',['早餐','晚餐','学校'],"早餐","","Wortschatz")],
"A2.1":[Q('Ich bleibe zu Hause, ___ ich krank bin.',['weil','oder','aber'],"weil","","Grammatik"),Q('Was ist das Gegenteil von "teuer"?',['billig','schnell','warm'],"billig","","Wortschatz")],
"A2.2":[Q('Wenn ich Zeit habe, ___ ich dich an.',['rufe','rufst','rufen'],"rufe","","Grammatik"),Q('Welches Wort passt zu "eine Entscheidung ___"?',['treffen','essen','fahren'],"treffen","","Wortschatz")]
},
"科学":{
G1:[Q("我们用哪个身体部位看东西？",["眼睛","耳朵","鼻子"],"眼睛","","生命科学"),Q("植物通常需要什么才能生长？",["水和阳光","塑料","石头"],"水和阳光","","生命科学")],
G2:[Q("冰受热后通常会变成什么？",["水","木头","沙子"],"水","","地球与物质"),Q("下列哪一种是生物？",["小树","石头","玻璃杯"],"小树","","生命科学")],
G3:[Q("植物制造养分时最重要的能量来源是什么？",["阳光","月光","土壤颜色"],"阳光","","生命科学"),Q("水从液态变成水蒸气叫做什么？",["蒸发","凝固","融化"],"蒸发","","地球与物质")],
G4:[Q("食物链中，绿色植物通常属于什么？",["生产者","消费者","分解后的石头"],"生产者","","生命科学"),Q("地球绕太阳运动称为什么？",["公转","自转","振动"],"公转","","地球与物质")],
G5:[Q("血液把氧气运输到身体各处，主要依靠哪个系统？",["循环系统","消化系统","骨骼系统"],"循环系统","","生命科学"),Q("物质由固态直接变成气态称为什么？",["升华","凝固","液化"],"升华","","地球与物质")],
G6:[Q("生态系统中分解者的重要作用是什么？",["分解有机物并促进物质循环","制造太阳光","停止植物生长"],"分解有机物并促进物质循环","","生命科学"),Q("月相变化主要与什么有关？",["太阳、地球和月球相对位置","月球自己发光强弱","天气温度"],"太阳、地球和月球相对位置","","地球与物质")]
}};
function mathQ(level,i,unit){
 const g=+level.slice(1); let a,b,q,ans,opts;
 if(unit==="单位换算"){
  if(g<=2){a=1+i%5;q=`${a} 米等于多少厘米？`;ans=a*100;opts=[ans,ans/10,ans*10]}
  else if(g<=4){a=2+i%7;q=`${a} 千米等于多少米？`;ans=a*1000;opts=[ans,ans*100,ans*10]}
  else{a=1+i%8;q=`${a}.5 千克等于多少克？`;ans=(a+0.5)*1000;opts=[ans,(a+0.5)*100,(a+0.5)*10]}
 }else if(unit==="奥数"){
  if(g<=2){a=3+i%5;q=`小明有 ${a} 颗糖，小红比他多 4 颗，两人一共有多少颗？`;ans=a+(a+4);opts=[ans,ans-4,ans+4]}
  else if(g<=4){a=4+i%5;q=`有 ${a} 个盒子，每盒 6 支笔，再增加 5 支，一共有多少支？`;ans=a*6+5;opts=[ans,a*6,ans+6]}
  else{a=3+i%6;q=`一个数的 ${a} 倍是 ${a*12}，这个数是多少？`;ans=12;opts=[12,a*12,a+12]}
 }else{
  if(g===1){a=3+i%7;b=2+(i*2)%7;q=`${a} + ${b} = ?`;ans=a+b;opts=[ans,ans+1,Math.max(0,ans-2)]}
  else if(g===2){a=20+i*3;b=4+i%8;q=`${a} - ${b} = ?`;ans=a-b;opts=[ans,ans+2,ans-3]}
  else if(g===3){a=3+i%7;b=4+(i*2)%6;q=`${a} × ${b} = ?`;ans=a*b;opts=[ans,ans+a,ans-b]}
  else if(g===4){b=3+i%6;ans=4+i%7;a=b*ans;q=`${a} ÷ ${b} = ?`;opts=[ans,ans+2,ans-1]}
  else if(g===5){a=10+i;b=3+i%4;q=`${a} × ${b} + 5 = ?`;ans=a*b+5;opts=[ans,a*b,ans+b]}
  else{a=12+i;b=4+i%5;q=`(${a} + ${b}) × 2 = ?`;ans=(a+b)*2;opts=[ans,a+b,ans+2]}
 }
 return Q(q,shuffle([...new Set(opts.map(String))]),String(ans),"",unit==="综合"?"基础数学":unit);
}
function chineseGenerated(level,i,unit){
 const g=+level.slice(1);
 const sets=[
 ["天空","蓝色","小鸟"],["认真","努力","学习"],["清晨","阳光","校园"],["勇敢","困难","坚持"],["观察","发现","思考"],["合作","沟通","完成"]
 ];
 const s=sets[(i+g)%sets.length];
 if(unit==="识字词语") return Q(`下面哪个词最适合和“${s[0]}”组成有意义的描述？`,[s[1],"完全无关","不知道"],s[1],"",unit);
 return Q(`短句：“${s[0]}里，孩子们${s[1]}地完成任务。”这句话主要描述什么？`,["孩子们完成任务","天气预报","购买物品"],"孩子们完成任务","",unit==="综合"?"阅读理解":unit);
}
function genericScience(level,i,unit){return fixed["科学"][level][i%fixed["科学"][level].length]}
function crossQ(level,i){
 const g=+level.slice(1);
 if(i%3===0){let n=5+g+i;return Q(`一个小组有 ${n} 本书，借出 ${g+2} 本，还剩多少本？`,[String(n-g-2),String(n-g),String(n+g)],String(n-g-2),"","综合挑战")}
 if(i%3===1)return Q("Which choice best shows good teamwork?",["Listen and share ideas","Ignore everyone","Quit immediately"],"Listen and share ideas","","综合挑战");
 return Q("做科学观察时，哪种做法更可靠？",["记录看到的事实","只写自己希望发生的结果","不做记录"],"记录看到的事实","","综合挑战");
}
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
let state={subject:"数学",level:"G3",unit:"综合",index:0,score:0,answered:false,questions:[]};
let stars=+localStorage.getItem("lq-stars-v1")||0,clears=+localStorage.getItem("lq-clears-v1")||0;
const $=s=>document.querySelector(s); $("#stars").textContent=stars;$("#clears").textContent=clears;
function renderSubjects(){const box=$("#subjects");box.innerHTML="";Object.entries(SUBJECTS).forEach(([name,s])=>{let b=document.createElement("button");b.className="card";b.innerHTML=`<div class="icon">${s.icon}</div><h3>${name}</h3><p>${s.desc}</p>`;b.onclick=()=>selectSubject(name);box.appendChild(b)})}
function selectSubject(name){state.subject=name;state.level=SUBJECTS[name].levels[Math.min(2,SUBJECTS[name].levels.length-1)];state.unit=SUBJECTS[name].units[0];$("#panel").classList.add("show");$("#subjectTitle").textContent=SUBJECTS[name].icon+" "+name;$("#subjectDesc").textContent=SUBJECTS[name].desc;renderLevels();renderUnits();startQuest();$("#panel").scrollIntoView({behavior:"smooth",block:"start"})}
function renderLevels(){let b=$("#levels");b.innerHTML="";SUBJECTS[state.subject].levels.forEach(n=>{let x=document.createElement("button");x.className="pill"+(n===state.level?" active":"");x.textContent=n;x.onclick=()=>{state.level=n;renderLevels();startQuest()};b.appendChild(x)})}
function renderUnits(){let b=$("#units");b.innerHTML="";SUBJECTS[state.subject].units.forEach(n=>{let x=document.createElement("button");x.className="pill"+(n===state.unit?" active":"");x.textContent=n;x.onclick=()=>{state.unit=n;renderUnits();startQuest()};b.appendChild(x)})}
function buildQuestions(){
 let arr=[],base=(fixed[state.subject]||{})[state.level]||[];
 let filtered=base.filter(x=>state.unit==="综合"||x.unit===state.unit);
 if(state.subject==="数学"){for(let i=0;i<10;i++)arr.push(mathQ(state.level,i,state.unit))}
 else if(state.subject==="综合挑战"){for(let i=0;i<10;i++)arr.push(crossQ(state.level,i))}
 else{
   if(!filtered.length)filtered=base;
   for(let i=0;i<10;i++){
     if(state.subject==="语文" && i>=filtered.length) arr.push(chineseGenerated(state.level,i,state.unit));
     else if(state.subject==="科学" && i>=filtered.length) arr.push(genericScience(state.level,i,state.unit));
     else arr.push(filtered[i%filtered.length]);
   }
 }
 return arr.map(x=>({...x,o:shuffle([...x.o])}));
}
function startQuest(){state.index=0;state.score=0;state.answered=false;state.questions=buildQuestions();$("#challenge").innerHTML='<div class="qnum" id="qnum"></div><div class="question" id="question"></div><div class="choices" id="choices"></div><div class="feedback" id="feedback"></div><div class="actions"><button class="next" id="next">下一题 →</button></div>';renderQ()}
function renderQ(){let q=state.questions[state.index];state.answered=false;$("#qnum").textContent=`${state.subject} · ${state.level} · ${state.unit}`;$("#question").textContent=q.q;$("#feedback").textContent="";$("#feedback").className="feedback";let c=$("#choices");c.innerHTML="";q.o.forEach(o=>{let b=document.createElement("button");b.className="choice";b.textContent=o;b.onclick=()=>answer(b,o,q);c.appendChild(b)});$("#next").style.display="none";$("#next").onclick=nextQ;updateMeta()}
function answer(btn,o,q){if(state.answered)return;if(String(o)===String(q.a)){state.answered=true;state.score++;stars++;localStorage.setItem("lq-stars-v1",stars);$("#stars").textContent=stars;btn.classList.add("good");[...$("#choices").children].forEach(x=>x.disabled=true);$("#feedback").textContent="✅ 正确！+1 ⭐";$("#feedback").className="feedback ok";$("#next").style.display="inline-block";updateMeta();setTimeout(()=>{if(state.answered)nextQ()},1100)}else{btn.classList.add("bad");btn.disabled=true;$("#feedback").textContent="再想一想。"+(q.tip?(" 提示："+q.tip):"");$("#feedback").className="feedback no"}}
function nextQ(){if(!state.answered)return;state.index++;if(state.index>=10)finish();else renderQ()}
function finish(){clears++;localStorage.setItem("lq-clears-v1",clears);$("#clears").textContent=clears;let pct=state.score*10;$("#challenge").innerHTML=`<div class="finish"><div class="big">${pct>=80?"🏆":"🌟"}</div><h3>本关完成！</h3><p>${state.subject} · ${state.level} · ${state.unit}</p><p><b>${state.score} / 10</b> 正确 · 正确率 ${pct}%</p><button class="next" style="display:inline-block" onclick="startQuest()">再挑战一次</button></div>`;$("#countText").textContent="10 / 10";$("#scoreText").textContent=`得分 ${state.score}`;$("#qbar").style.width="100%";$("#heroText").textContent=`刚完成 ${state.subject} ${state.level}，正确率 ${pct}%。`}
function updateMeta(){let done=state.index+(state.answered?1:0);$("#countText").textContent=`${Math.min(state.index+1,10)} / 10`;$("#scoreText").textContent=`得分 ${state.score}`;$("#qbar").style.width=(done/10*100)+"%";$("#bar").style.width=Math.min(100,10+stars%91)+"%"}
$("#restart").onclick=startQuest;renderSubjects();selectSubject("数学");
</script></body></html>
